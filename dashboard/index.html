<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>장금상선 AX 대시보드</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="scrim" id="scrim"></div>

<div class="shell">
  <aside class="glass side" id="side" aria-label="메뉴">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <div class="bname">장금상선 AX</div>
        <div class="bsub">조원 12명 · 에이전트 12개</div>
      </div>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="sidefoot">
      <button class="btn ghost" id="themeBtn" type="button" aria-label="밝게/어둡게 바꾸기">테마 바꾸기</button>
      <span class="sub">가상 데이터 · 보내기 없음</span>
    </div>
  </aside>

  <div class="main">
    <div class="topbar glass">
      <button class="btn ghost" id="menuBtn" type="button" aria-label="메뉴 열기">메뉴</button>
      <b>장금상선 AX 대시보드</b>
    </div>
    <main id="view" class="view" aria-live="polite"></main>
  </div>
</div>

<script type="module" src="js/app.js"></script>

</html>
